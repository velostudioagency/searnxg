# Minimal SearXNG configuration for use as a SearNXG backend.
# The JSON format is required for the best integration (HTML fallback also works).

use_default_settings: true

general:
  # Some engines (Wikipedia, Wikidata, OpenStreetMap) refuse to load without this.
  contact_url: "mailto:admin@localhost"

server:
  # Change this before exposing the instance publicly.
  secret_key: "change-this-secret-key"
  allowed_hosts: ["*"]
  base_url: "http://localhost:8080"

search:
  safe_search: 0
  autocomplete: ""
  default_language: "en"
  formats:
    - json
    - html

engines:
  # Some public engines block datacenter IPs; disable them if they time out.
  - name: google
    disabled: true
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
